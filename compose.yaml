services:
  app:
    build: .
    image: resheno:latest
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 8080
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - app-data:/app/data
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    command: tunnel --no-autoupdate --protocol http2 --url http://app:8080
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      - app
    profiles: ["tunnel"]
    restart: unless-stopped

volumes:
  app-data:
